<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Library</title>
  </head>
  <body>
    <h1>My Library</h1>
    <ul>
      {% if not books: %}
        <li>The library is empty</li>
      {% else: %}
        {% for b in books: %}
          <li>{{ b["title"] }} - written by: {{ b["author"] }} - {{ b["rating"] }}</li>
        {% endfor %}
      {% endif %}
    </ul>

    <a href="{{ url_for('add') }}">Add New Book</a>
  </body>
</html>
